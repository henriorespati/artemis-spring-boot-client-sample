spring:
  artemis:
    user: admin
    password: password
    broker-url: (tcp://localhost:61817,tcp://localhost:61717,tcp://localhost:61617)?sslEnabled=true&trustStoreType=PKCS12&trustStorePath=truststore.p12&trustStorePassword=changeit&verifyHost=false&useTopologyForLoadBalancing=true&reconnectAttempts=1&failoverAttempts=1&retryInterval=1000
    #&connectionLoadBalancingPolicyClassName=org.apache.activemq.artemis.api.core.client.loadbalance.RandomConnectionLoadBalancingPolicy
    #&clientFailureCheckPeriod=10000
    #&retryInterval=1000&callTimeout=1000&blockOnAcknowledge=true
    #&connectionTTL=500
    ##
    ##&retryIntervalMultiplier=1.0&maxRetryInterval=5000
    ##&consumerWindowSize=-1&producerWindowSize=-1
    ##&confirmationWindowSize=1048576
    
    pool:
      enabled: true                     # enable JmsPoolConnectionFactory
      max-connections: 1                # max physical connections
      max-sessions-per-connection: 500  # max sessions per connection
      idle-timeout: 30000               # ms before idle connections are closed

  # Listener/template parameters
  jms:
    cache:
      session-cache-size: 10          # number of cached sessions
      consumers: true
      producers: true

    listener:
      min-concurrency: 10                # min concurrent consumers
      max-concurrency: 10                # max concurrent consumers

    # template:
    #   receive-timeout: 1000             # timeout for receive() in ms
    #   session:
    #     acknowledge-mode: auto        # session acknowledge mode

app:
  queue:
    sync: syncQueue
  consumer:
    sync-callback-url: http://localhost:8080/artemis/receive/sync

logging:
  file:
    path: logs
  level:
    root: info
    com.example.artemis: debug
    # org.apache.activemq.artemis: debug
    org.apache.activemq.artemis.core.client: debug
    # org.apache.activemq.artemis.api.core.client: debug
    # org.apache.activemq.artemis.jms.client: debug
    # org.springframework.jms.connection: debug
    # org.springframework.jms.listener: debug    
    org.messaginghub.pooled.jms: debug
