spring:
  artemis:
    user: admin
    password: password
    broker-url: (tcp://localhost:61617)?sslEnabled=true&trustStoreType=PKCS12&trustStorePath=truststore.p12&trustStorePassword=changeit&verifyHost=false
    #,tcp://localhost:61717
    ##&reconnectAttempts=1&failoverAttempts=1&callTimeout=10000
    ##&useTopologyForLoadBalancing=false
    ##&retryInterval=1000&retryIntervalMultiplier=1.0&maxRetryInterval=5000
    ##&consumerWindowSize=-1&producerWindowSize=-1
    ##&confirmationWindowSize=1048576
    
    pool:
      enabled: true                     # enable JmsPoolConnectionFactory
      max-connections: 1                # max physical connections
      max-sessions-per-connection: 20   # max sessions per connection
      # idle-timeout: 30000               # ms before idle connections are closed

  # Listener/template parameters
  jms:
    listener:
      min-concurrency: 2            # min concurrent consumers
      max-concurrency: 2            # max concurrent consumers

    template:
      receive-timeout: 1000         # timeout for receive() in ms
      session:
        transacted: true            # use transacted sessions

app:
  queue:
    transaction: transactionQueue
    spring-transaction: springTransactionQueue
  consumer:
    callback-url: http://localhost:8080/artemis/receive/transaction

logging:
  level:
    root: info
    com.example.artemis: info
    org.apache.activemq.artemis: info
    org.apache.activemq.artemis.core.client: info
    org.apache.activemq.artemis.api.core.client: info
    org.apache.activemq.artemis.jms.client: info
    org.springframework.jms.connection: info
    org.springframework.jms.core.JmsTemplate: info
    # org.springframework.jms.listener: debug    
    # org.messaginghub.pooled.jms: debug